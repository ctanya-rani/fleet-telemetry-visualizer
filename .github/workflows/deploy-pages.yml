name: Deploy demo to GitHub Pages

# Deploys the static demo to the gh-pages branch, which GitHub Pages serves
# automatically. (The actions-based Pages deployment needs the site created
# from repo Settings first; branch-based deployment self-enables.)

on:
  push:
    branches: [claude/iot-fleet-telemetry-viz-8j9in9]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node demo/build.mjs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
